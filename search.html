<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keresési eredmények – PricePulse HU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">PricePulse <span>HU</span></a>
      <div class="nav-links">
        <a href="/" class="nav-link" id="watchlistLink">Figyelőlista</a>
        <button class="lang-toggle" onclick="toggleLang()" id="langBtn">EN</button>
        <a href="https://github.com/oliprovscode/hu-deals-finder" target="_blank" class="nav-github">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.031 1.531 1.031.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
          GitHub
        </a>
      </div>
    </div>
  </nav>

  <div class="search-page-header">
    <div class="container">
      <form onsubmit="reSearch(event)" style="display:flex;gap:8px;max-width:540px">
        <input id="searchInput" class="search-bar" style="flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:0.95rem;font-family:inherit;background:var(--bg);color:var(--text);outline:none" placeholder="Keresés..." />
        <button type="submit" class="btn-primary">Keresés</button>
      </form>
      <p class="search-meta" id="searchMeta"></p>
    </div>
  </div>

  <section class="results-section">
    <div class="container">
      <div class="results-layout">
        <!-- SIDEBAR -->
        <aside class="filters-sidebar" id="filtersSidebar">
          <div class="filter-block">
            <div class="filter-block-title">Kategória</div>
            <div class="filter-cat-list">
              <button class="filter-btn active" onclick="filterCategory('all', this)">Összes</button>
              <button class="filter-btn" onclick="filterCategory('electronics', this)">Elektronika</button>
              <button class="filter-btn" onclick="filterCategory('watches', this)">Órák</button>
              <button class="filter-btn" onclick="filterCategory('skincare', this)">Bőrápolás</button>
              <button class="filter-btn" onclick="filterCategory('fashion', this)">Divat</button>
              <button class="filter-btn" onclick="filterCategory('beauty', this)">Szépség</button>
              <button class="filter-btn" onclick="filterCategory('home', this)">Otthon</button>
              <button class="filter-btn" onclick="filterCategory('sports', this)">Sport</button>
            </div>
          </div>
          <div class="filter-block">
            <div class="filter-block-title">Ártartomány (Ft)</div>
            <div class="price-range-wrap">
              <div class="price-range-vals"><span id="priceMin">0</span> Ft — <span id="priceMax">500 000</span> Ft</div>
              <input type="range" id="rangeMin" min="0" max="500000" value="0" oninput="updatePriceRange()"/>
              <input type="range" id="rangeMax" min="0" max="500000" value="500000" oninput="updatePriceRange()"/>
            </div>
          </div>
          <div class="filter-block">
            <div class="filter-block-title">Bolt</div>
            <div class="filter-store-list" id="storeList"></div>
          </div>
          <div class="filter-block">
            <div class="filter-block-title">Márka</div>
            <div class="filter-brand-list" id="brandList"></div>
          </div>
          <div class="filter-block">
            <label class="toggle-label">
              <input type="checkbox" id="inStockOnly" onchange="renderDeals()"/>
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              Csak raktáron lévő
            </label>
          </div>
        </aside>

        <!-- MAIN -->
        <div class="results-main">
          <div class="results-topbar" id="resultsTopbar" style="display:none">
            <span class="results-count" id="resultsCount"></span>
            <div style="display:flex;gap:8px;align-items:center">
              <button class="mobile-filter-btn" onclick="document.getElementById('filtersSidebar').classList.toggle('sidebar-open')">Szűrők</button>
              <select class="sort-select" id="sortSelect" onchange="sortDeals()">
                <option value="discount">Legjobb akció</option>
                <option value="price-asc">Ár: alacsony → magas</option>
                <option value="price-desc">Ár: magas → alacsony</option>
              </select>
            </div>
          </div>
          <div class="deals-grid" id="dealsGrid"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- COMPARE TRAY -->
  <div class="compare-tray" id="compareTray">
    <span class="tray-label" id="trayLabel">Összehasonlítás</span>
    <div class="tray-chips" id="compareTrayItems"></div>
    <div class="tray-actions">
      <button class="btn-tray-clear" onclick="clearCompare()">Törlés</button>
      <a href="/compare.html" class="btn-tray-compare" id="compareTrayBtn">Összehasonlítás (0)</a>
    </div>
  </div>

  <script>
    function toggleLang() {
      var lang = localStorage.getItem('pp_lang') || 'hu';
      var next = lang === 'hu' ? 'en' : 'hu';
      localStorage.setItem('pp_lang', next);
      document.getElementById('langBtn').textContent = next === 'hu' ? 'EN' : 'HU';
      location.reload();
    }
    function clearCompare() {
      compareList = [];
      localStorage.setItem('pp_compare', '[]');
      renderDeals();
      syncCompareTray();
    }
    document.addEventListener('DOMContentLoaded', function() {
      var lang = localStorage.getItem('pp_lang') || 'hu';
      document.getElementById('langBtn').textContent = lang === 'hu' ? 'EN' : 'HU';
    });
  </script>
  <script src="search.js"></script>
</body>
</html>
