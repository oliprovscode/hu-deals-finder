<!DOCTYPE html>
<html lang="hu" data-lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keresési eredmények - PricePulse HU</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">PricePulse <span>HU</span></a>
      <div class="nav-links">
        <a href="/#watchlist" class="nav-link" data-hu="Figyelőlista" data-en="Watchlist">Figyelőlista</a>
        <button class="lang-toggle" id="langToggle" onclick="toggleLang()">EN</button>
        <a href="https://github.com/oliprovscode/hu-deals-finder" target="_blank" rel="noopener" class="nav-github">
          <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </nav>

  <div class="search-page-header">
    <div class="container">
      <form class="search-bar" onsubmit="reSearch(event)">
        <input type="text" id="searchInput" data-hu-placeholder="Keress terméket, márkát..." data-en-placeholder="Search any product, brand..." placeholder="Keress terméket, márkát..." autocomplete="off" />
        <button type="submit" class="btn-primary" data-hu="Keresés" data-en="Search">Keresés</button>
      </form>
      <div class="search-meta" id="searchMeta"></div>
    </div>
  </div>

  <main class="results-section">
    <div class="container results-layout">

      <!-- SIDEBAR FILTERS -->
      <aside class="filters-sidebar" id="filtersSidebar">
        <div class="filter-block">
          <div class="filter-block-title" data-hu="Kategória" data-en="Category">Kategória</div>
          <div class="filter-cat-list">
            <button class="filter-btn active" onclick="filterCategory('all',this)" data-hu="Összes" data-en="All">Összes</button>
            <button class="filter-btn" onclick="filterCategory('electronics',this)" data-hu="Elektronika" data-en="Electronics">Elektronika</button>
            <button class="filter-btn" onclick="filterCategory('watches',this)" data-hu="Órák" data-en="Watches">Órák</button>
            <button class="filter-btn" onclick="filterCategory('skincare',this)" data-hu="Bőrápolás" data-en="Skincare">Bőrápolás</button>
            <button class="filter-btn" onclick="filterCategory('fashion',this)" data-hu="Divat" data-en="Fashion">Divat</button>
            <button class="filter-btn" onclick="filterCategory('beauty',this)" data-hu="Szépség" data-en="Beauty">Szépség</button>
            <button class="filter-btn" onclick="filterCategory('home',this)" data-hu="Otthon" data-en="Home">Otthon</button>
            <button class="filter-btn" onclick="filterCategory('sports',this)" data-hu="Sport" data-en="Sports">Sport</button>
          </div>
        </div>

        <div class="filter-block">
          <div class="filter-block-title" data-hu="Ártartomány (Ft)" data-en="Price range (Ft)">Ártartomány (Ft)</div>
          <div class="price-range-wrap">
            <div class="price-range-vals">
              <span id="priceMin">0</span> Ft — <span id="priceMax">500 000</span> Ft
            </div>
            <input type="range" id="rangeMin" min="0" max="500000" step="1000" value="0" oninput="updatePriceRange()" />
            <input type="range" id="rangeMax" min="0" max="500000" step="1000" value="500000" oninput="updatePriceRange()" />
          </div>
        </div>

        <div class="filter-block">
          <div class="filter-block-title" data-hu="Bolt" data-en="Store">Bolt</div>
          <div class="filter-store-list" id="storeList"><p class="filter-empty-hint" data-hu="Keresés után elérhetők" data-en="Available after search">Keresés után elérhetők</p></div>
        </div>

        <div class="filter-block">
          <div class="filter-block-title" data-hu="Márka" data-en="Brand">Márka</div>
          <div class="filter-brand-list" id="brandList"><p class="filter-empty-hint" data-hu="Keresés után elérhetők" data-en="Available after search">Keresés után elérhetők</p></div>
        </div>

        <div class="filter-block">
          <div class="filter-block-title" data-hu="Elérhetőség" data-en="Availability">Elérhetőség</div>
          <label class="toggle-label">
            <input type="checkbox" id="inStockOnly" onchange="renderDeals()" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span data-hu="Csak raktáron lévők" data-en="In stock only">Csak raktáron lévők</span>
          </label>
        </div>

        <div class="filter-block">
          <div class="filter-block-title" data-hu="Rendezés" data-en="Sort">Rendezés</div>
          <select id="sortSelect" class="sort-select" onchange="sortDeals()">
            <option value="discount" data-hu="Legnagyobb kedvezmény" data-en="Biggest discount">Legnagyobb kedvezmény</option>
            <option value="price-asc" data-hu="Ár: növekvő" data-en="Price: Low to High">Ár: növekvő</option>
            <option value="price-desc" data-hu="Ár: csökkenő" data-en="Price: High to Low">Ár: csökkenő</option>
          </select>
        </div>
      </aside>

      <!-- RESULTS -->
      <div class="results-main">
        <div class="results-topbar" id="resultsTopbar" style="display:none">
          <span class="results-count" id="resultsCount"></span>
          <button class="mobile-filter-btn" onclick="toggleSidebar()" data-hu="Szűrők" data-en="Filters">Szűrők</button>
        </div>
        <div class="deals-grid" id="dealsGrid"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <span class="nav-logo">PricePulse <span>HU</span></span>
        <p data-hu="Az árak a Google Shopping-on keresztül. Nem állunk kapcsolatban egyetlen kereskedővel sem." data-en="Prices sourced via Google Shopping. Not affiliated with any retailer.">Az árak a Google Shopping-on keresztül. Nem állunk kapcsolatban egyetlen kereskedővel sem.</p>
      </div>
      <div class="footer-right">
        <a href="https://github.com/oliprovscode/hu-deals-finder" target="_blank" rel="noopener" class="footer-github" aria-label="GitHub">
          <svg height="22" width="22" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="search.js"></script>
  <script>
    var currentLang = localStorage.getItem('pp_lang') || 'hu';
    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('pp_lang', lang);
      document.documentElement.setAttribute('data-lang', lang);
      document.getElementById('langToggle').textContent = lang === 'hu' ? 'EN' : 'HU';
      document.querySelectorAll('[data-hu]').forEach(function(el) {
        var text = el.getAttribute('data-' + lang);
        if (text !== null) el.innerHTML = text;
      });
      document.querySelectorAll('[data-hu-placeholder]').forEach(function(el) {
        var ph = el.getAttribute('data-' + lang + '-placeholder');
        if (ph) el.placeholder = ph;
      });
    }
    function toggleLang() { applyLang(currentLang === 'hu' ? 'en' : 'hu'); }
    function toggleSidebar() {
      document.getElementById('filtersSidebar').classList.toggle('sidebar-open');
    }
    document.addEventListener('DOMContentLoaded', function() { applyLang(currentLang); });
  </script>
</body>
</html>
